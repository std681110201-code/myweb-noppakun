<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>นาย นพคุณ บุญส่ง</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dfefff,#ffffff);
}

.card{
    width:380px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.header{
    background:#4A90E2;
    color:#fff;
    padding:20px;
}

.header h1{
    font-size:28px;
}

.photo{
    padding:20px;
}

.photo img{
    width:90%;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.name{
    font-size:30px;
    font-weight:bold;
    color:#333;
    margin-bottom:10px;
}

.desc{
    color:#666;
    padding:0 25px 25px;
    line-height:1.8;
}

.btn{
    display:inline-block;
    margin-bottom:25px;
    padding:12px 30px;
    background:#4A90E2;
    color:#fff;
    text-decoration:none;
    border-radius:30px;
    transition:.3s;
}

.btn:hover{
    background:#2563eb;
}

footer{
    background:#f5f5f5;
    padding:15px;
    color:#666;
    font-size:14px;
}

@media(max-width:500px){
.card{
    width:95%;
}
.name{
    font-size:24px;
}
}
</style>

</head>
<body>

<div class="card">

    <div class="header">
        <h1>MY PROFILE</h1>
    </div>

    <div class="photo">
        <img src="c:\Users\Administrator\Downloads\fer.png" alt="Profile">
    </div>

    <div class="name">
        นาย นพคุณ บุญส่ง
    </div>

    <div class="desc">
        เว็บไซต์แสดงข้อมูลส่วนตัวอย่างง่าย<br>
        สามารถแก้ไขรูปภาพ ข้อความ และตกแต่งเพิ่มเติมได้ตามต้องการ
    </div>

    <a href="#" class="btn">ยินดีต้อนรับ</a>

    <footer>
        © 2026 นาย นพคุณ บุญส่ง
    </footer>

</div>

</body>
</html>
